name: Wristbeam
options:
  minimumXcodeGenVersion: 2.44.0
  developmentLanguage: en
  knownRegions: [en, zh-Hans]
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Wristbeam:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS
        excludes: [Resources]
      - path: iOS/Resources
        buildPhase: resources
      - path: Shared
      - path: Resources
        buildPhase: resources
    info:
      path: build/iOS-Info.plist
      properties:
        CFBundleDisplayName: Wristbeam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WRISTBEAM_BUNDLE_PREFIX).Wristbeam
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: WristbeamWatch
        embed: true
  WristbeamWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch
      - path: Shared
      - path: Resources
        buildPhase: resources
    info:
      path: build/watchOS-Info.plist
      properties:
        CFBundleDisplayName: Wristbeam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(WRISTBEAM_BUNDLE_PREFIX).Wristbeam
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WRISTBEAM_BUNDLE_PREFIX).Wristbeam.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
schemes:
  Wristbeam:
    build:
      targets:
        Wristbeam: all
    run:
      config: Debug
  WristbeamWatch:
    build:
      targets:
        WristbeamWatch: all
    run:
      config: Debug
